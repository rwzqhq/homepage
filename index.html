<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#323232" />
    <meta name="description" content="一个干净的浏览器起始页。" />

    <title>青柠起始页</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('limestart-homepage:v1:theme') || 'null');
        if (saved === 'dark') document.documentElement.classList.add('dark');
      } catch (error) {
        /* first visit */
      }
    </script>
